[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "juggernaut-agent"
version = "0.1.0"
description = "A template for relentless, single-goal AI agents. One goal, or die."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "prayingperceptions" }]
keywords = ["ai-agent", "autonomous-agent", "laya", "bitcoin", "single-goal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
brain = ["laya-mlx"]   # Apple Silicon only -- the real reflex layer
dev = ["pytest"]

[project.scripts]
juggernaut = "juggernaut.cli:main"

[project.urls]
Homepage = "https://github.com/prayingperceptions/juggernaut"
Repository = "https://github.com/prayingperceptions/juggernaut"

[tool.setuptools.packages.find]
include = ["juggernaut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
